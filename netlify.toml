# Hybrid model: scoring runs locally on the Max plan and pushes web/ here.
# No build step — web/ is already static, so deploys cost zero build minutes.
[build]
  publish = "web"
  command = ""

# Live-spot service: runs server-side on Netlify so the dashboard's spot keeps
# updating even when the local scoring box is off (see netlify/functions/spot.mjs).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cloud watchdog: every 15 min it reads dashboard.json and pushes an ntfy alert if the board
# has gone stale during market hours (catches PC-off / loop-crash / publish-stuck). The function
# self-gates to the 09:50–16:00 ET window, so off-hours runs are cheap no-ops. See watchdog.mjs.
[functions."watchdog"]
  schedule = "*/15 * * * *"

# Cloud capture: every 15 min it snapshots YYY's flow/greek surface to Netlify Blobs, so option
# positioning isn't lost when the scoring PC is off. The function self-gates to 09:00–16:00 ET
# Mon–Fri (cheap no-op otherwise). Recover with `npm run backfill`. See capture.mjs.
# YYY is unauthenticated; only YYY_BASE_URL matters, and only if the backend URL changes.
[functions."capture"]
  schedule = "*/15 * * * *"

# Scheduled regime refresh: recomputes the Regime engine to Blobs during RTH so the headless
# scorer's regime block is never stale (the HTTP regime function only recomputes on view).
[functions."regime-cron"]
  schedule = "*/15 * * * *"

# News watchdog: every 15 min it checks today's USD high-impact ("red folder") economic
# calendar (NFP, CPI, FOMC, etc.) and pushes an ntfy alert ~20 min ahead of each release, plus
# one morning digest of the day's times. Self-gates to 06:00-16:00 ET Mon-Fri. Reuses
# NTFY_TOPIC/NTFY_SERVER from the watchdog config — no extra env needed. See news-cron.mjs.
[functions."news-cron"]
  schedule = "*/15 * * * *"

# NOTE: dashboard.json / narrative.json / regime.json are intentionally NOT deployed (they'd be
# public and bypass the login) — the board is served from Netlify Blobs via the token-checked
# dashboard/narrative functions. See stageWebDir() in src/publish.ts.

# The shell + assets must revalidate every load, or a redeploy shows the OLD UI
# (browser keeps the cached styles.css/app.js). no-cache = use cache only after a
# 304, so deploys appear immediately without bumping ?v= by hand.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"
# The front end is an ES-module graph rooted at app.js. Its imports are plain relative URLs
# with no hashing, so every file under /lib must revalidate too — otherwise a deploy ships a
# new app.js against a cached lib/ and the two disagree about function signatures.
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "no-cache"
