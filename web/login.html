<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f4f2" />
<meta name="robots" content="noindex, nofollow" />
<title>TORII · AUTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@600&display=swap" rel="stylesheet" />
<style>
/* Self-contained: the login must render before anything else is fetched, and it must not
   depend on the app's stylesheet (which is versioned with the terminal, not with auth). */
:root {
  --bg:#f4f4f2; --panel:#fff; --ink:#0d0d0c; --ink2:#55554f; --ink3:#9a9a92;
  --line:#e4e4e0; --line2:#cdcdc7; --red:#e0001e;
  --mono:"JetBrains Mono",ui-monospace,monospace; --jp:"Noto Sans JP",var(--mono);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#070707; --panel:#0c0c0c; --ink:#f1f1ef; --ink2:#9c9c95; --ink3:#63635d;
    --line:#1c1c1a; --line2:#2c2c29; --red:#ff2233;
    color-scheme: dark;
  }
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body {
  min-height:100dvh; background:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:13px; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
#bg { position:fixed; inset:0; z-index:0; pointer-events:none; }

.shell {
  position:relative; z-index:1; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; padding:28px max(18px, env(safe-area-inset-left)) 40px;
}

.ident { text-align:center; display:flex; flex-direction:column; gap:5px; }
.ident-kanji { font-family:var(--jp); font-size:26px; color:var(--red); letter-spacing:.06em; line-height:1; }
.ident-en { font-size:14px; font-weight:700; letter-spacing:.42em; padding-left:.42em; }
.ident-sub { font-size:9px; letter-spacing:.22em; color:var(--ink3); text-transform:uppercase; }

.card { width:min(360px, 100%); border:1px solid var(--line2); background:var(--panel); }
.card-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 10px 6px 0; border-bottom:1px solid var(--line);
  font-size:9px; letter-spacing:.2em; color:var(--ink3); text-transform:uppercase;
}
.card-ix { background:var(--ink); color:var(--bg); padding:4px 7px; letter-spacing:.1em; }
.card-body { padding:16px; display:flex; flex-direction:column; gap:14px; }

.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:9px; letter-spacing:.2em; color:var(--ink3); text-transform:uppercase; }
.field input {
  font:inherit; font-size:13px; color:var(--ink);
  background:transparent; border:0; border-bottom:1px solid var(--line2);
  padding:6px 2px; outline:none; transition:border-color .15s ease;
}
.field input:focus { border-bottom-color:var(--red); }
.field input:-webkit-autofill { -webkit-text-fill-color:var(--ink); transition:background-color 9999s; }

.btn {
  font:inherit; font-size:10px; letter-spacing:.24em; text-transform:uppercase;
  background:var(--ink); color:var(--bg); border:1px solid var(--ink);
  padding:10px; cursor:pointer; transition:opacity .15s ease;
}
.btn:hover:not(:disabled) { opacity:.82; }
.btn:disabled { opacity:.45; cursor:progress; }

#err { font-size:10px; color:var(--red); letter-spacing:.06em; min-height:14px; line-height:1.4; }
.note { font-size:9px; letter-spacing:.18em; color:var(--ink3); text-transform:uppercase; }

@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="shell">
  <div class="ident">
    <div class="ident-kanji">鳥居</div>
    <div class="ident-en">TORII</div>
    <div class="ident-sub">QQQ options flow &middot; authentication required</div>
  </div>

  <div class="card">
    <div class="card-head"><span class="card-ix">00</span><span>SIGN IN</span></div>
    <div class="card-body">
      <form id="f">
        <div class="field">
          <label for="u">Operator</label>
          <input id="u" type="text" autocomplete="username" spellcheck="false" autocapitalize="off" required>
        </div>
        <div class="field" style="margin-top:14px">
          <label for="p">Key</label>
          <input id="p" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="btn" style="margin-top:18px;width:100%">Authenticate</button>
        <div id="err" style="margin-top:10px"></div>
      </form>
    </div>
  </div>

  <div class="note">private instrument &middot; no public access</div>
</div>

<script>
/* The same character field the terminal uses, in miniature: a mostly-blank glyph grid with a
   handful of cells resolving and dissolving. Decorative and fully optional. */
(() => {
  const c = document.getElementById("bg"), ctx = c.getContext("2d");
  if (!ctx) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const GL = "01█▓▒░+·=─│┼┴┬┤├/\\<>";
  const CELL = 15;
  let cols = 0, rows = 0, cells = [], scan = -0.3, last = 0, ink = "rgba(0,0,0,.06)";

  function palette() {
    ink = matchMedia("(prefers-color-scheme: dark)").matches ? "rgba(241,241,239,.085)" : "rgba(13,13,12,.055)";
  }
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1), w = innerWidth, h = innerHeight;
    c.width = w * dpr; c.height = h * dpr; c.style.width = w + "px"; c.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / CELL) + 1; rows = Math.ceil(h / CELL) + 1;
    cells = new Array(cols * rows).fill(null);
    ctx.font = '12px "JetBrains Mono",ui-monospace,monospace'; ctx.textBaseline = "top";
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.2, (now - last) / 1000);
    if (dt < 1 / 13) return;
    last = now;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = ink;
    for (let i = 0; i < 3; i++) {
      const k = Math.random() * cells.length | 0;
      if (!cells[k]) cells[k] = { ch: GL[Math.random() * GL.length | 0], life: .6 + Math.random() * 2.4, age: 0 };
    }
    scan += dt * .055; if (scan > 1.3) scan = -.3;
    const sr = scan * rows;
    for (let i = 0; i < cells.length; i++) {
      const cel = cells[i]; if (!cel) continue;
      cel.age += dt;
      if (cel.age >= cel.life) { cells[i] = null; continue; }
      const r = i / cols | 0, col = i % cols, t = cel.age / cel.life;
      let a = t < .25 ? t / .25 : (1 - t) / .75;
      const d = Math.abs(r - sr);
      if (d < 2) a = Math.min(1, a + (2 - d) * .55);
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.fillText(cel.ch, col * CELL, r * CELL);
    }
    ctx.globalAlpha = 1;
  }
  palette(); resize();
  addEventListener("resize", resize);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", palette);
  requestAnimationFrame(frame);
})();

if (localStorage.getItem("authToken")) location.href = "/";

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err"), btn = document.getElementById("btn");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Verifying…";
  try {
    const res = await fetch("/.netlify/functions/auth", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value.trim(),
        password: document.getElementById("p").value,
      }),
    });
    if (res.status === 401) { err.textContent = "ACCESS DENIED — invalid credentials"; return; }
    if (res.status === 429) { err.textContent = "TOO MANY ATTEMPTS — wait a few minutes"; return; }
    if (!res.ok) { err.textContent = `SERVER ERROR ${res.status} — try again`; return; }
    const { token, user } = await res.json();
    localStorage.setItem("authToken", token);
    localStorage.setItem("authUser", user);
    localStorage.setItem("lastSeen", String(Date.now()));
    location.href = "/";
  } catch { err.textContent = "NETWORK ERROR — check connection"; }
  finally { btn.disabled = false; btn.textContent = "Authenticate"; }
});
</script>
</body>
</html>
