<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f2" />
  <title>TORII · QQQ OPTIONS FLOW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- the character field: one canvas, drawn in the same language as the data -->
<canvas id="bg" class="bg-canvas" aria-hidden="true"></canvas>

<main id="app">

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">鳥居</span>
      <span class="brand-text">
        <b>TORII</b>
        <i>QQQ OPTIONS FLOW TERMINAL &middot; YYY</i>
      </span>
    </div>

    <div class="top-right">
      <span class="status">
        <i class="dot" id="statusDot"></i>
        <span id="statusText">BOOT</span>
        <em id="statusAge"></em>
      </span>
      <span class="clock" id="clock">--:--:-- ET</span>
      <button class="ibtn" id="themeToggle" type="button" aria-label="Toggle dark mode">☾</button>
      <button class="ibtn" id="refresh" type="button" aria-label="Refresh" title="Refresh">↻</button>
      <span class="who"><span id="accountUser"></span><button class="ibtn" id="signout" type="button" title="Sign out" aria-label="Sign out">⏻</button></span>
    </div>
  </header>

  <!-- always-visible price + context strip; every tab reads against this -->
  <section class="rail" aria-label="Spot">
    <div class="rail-price">
      <span class="rail-spot" id="railSpot">—</span>
      <span class="rail-chg" id="railChg"></span>
      <span class="rail-src" id="railSrc"></span>
    </div>
    <pre class="rail-spark" id="railSpark" aria-hidden="true"></pre>
    <div class="rail-chips" id="railChips"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div id="viewRoot" class="views"></div>

  <footer class="foot">
    <span>TORII</span>
    <span class="foot-sep">│</span>
    <span>live: YYY backend</span>
    <span class="foot-sep">│</span>
    <span>desk: local scorer (age-stamped)</span>
    <span class="foot-sep">│</span>
    <span>bars: Yahoo</span>
  </footer>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
